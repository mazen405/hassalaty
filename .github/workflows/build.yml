name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Extract uploaded app version
        run: |
          test -s hassalaty-update.zip
          mkdir -p source www assets
          unzip -o hassalaty-update.zip -d source
          test -s source/index.html
          test -s source/icon-app.png
          test -s source/icon-foreground.png
          cp source/index.html www/index.html
          cp source/icon-app.png assets/icon-only.png
          cp source/icon-foreground.png assets/icon-foreground.png
          cp source/icon-foreground.png assets/icon-background.png

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app@6 @fontsource/cairo @fontsource/tajawal

      - name: Bundle Arabic fonts
        run: |
          mkdir -p www/fonts
          for spec in cairo:400 cairo:700 tajawal:400 tajawal:500 tajawal:700 tajawal:800; do
            fam=${spec%%:*}; w=${spec##*:}
            f=$(find node_modules/@fontsource/$fam/files -type f -name "$fam-arabic-$w-normal.woff2" -print -quit)
            if [ -z "$f" ]; then echo "warning: $fam $w not found" >&2; continue; fi
            cp "$f" "www/fonts/$fam-arabic-$w-normal.woff2"
          done
          test -f www/fonts/tajawal-arabic-400-normal.woff2 || { echo "Tajawal missing" >&2; exit 1; }

      - name: Create Android project
        run: |
          echo '{"appId":"com.hassalaty.app","appName":"حصّالتي","webDir":"www","backgroundColor":"#07110E","android":{"backgroundColor":"#07110E"}}' > capacitor.config.json
          npx cap add android

      - name: Match Android gesture navigation to app theme
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in [Path('android/app/src/main/res/values/styles.xml'), Path('android/app/src/main/res/values-night/styles.xml')]:
              if not p.exists():
                  continue
              s=p.read_text()
              dark = 'values-night' in str(p)
              bar_color = '#07110E' if dark else '#F6F3EC'
              light_bar = 'false' if dark else 'true'
              items=[
                  ('android:navigationBarColor', bar_color),
                  ('android:navigationBarDividerColor', bar_color),
                  ('android:windowLightNavigationBar', light_bar),
              ]
              for key, value in items:
                  line=f'<item name="{key}">{value}</item>'
                  pattern=r'<item name="' + re.escape(key) + r'">.*?</item>'
                  if re.search(pattern, s):
                      s=re.sub(pattern, line, s, count=1)
                  else:
                      s=s.replace('</style>', '    '+line+'\\n  </style>', 1)
              p.write_text(s)
          PY

      - name: Generate icons
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000'

      - name: Fix adaptive icon background resource
        run: |
          python3 - <<'PY'
          from pathlib import Path
          res = Path('android/app/src/main/res')
          values = res / 'values'
          values.mkdir(parents=True, exist_ok=True)
          colors = values / 'colors.xml'
          generated_color = values / 'ic_launcher_background.xml'
          color = '<color name="ic_launcher_background">#000000</color>'
          if not generated_color.exists():
              if colors.exists():
                  text = colors.read_text()
                  if 'name="ic_launcher_background"' not in text:
                      text = text.replace('</resources>', f'  {color}\\n</resources>')
                      colors.write_text(text)
              else:
                  colors.write_text(f'<resources>\\n  {color}\\n</resources>\\n')
          for p in (res / 'mipmap-anydpi-v26').glob('ic_launcher*.xml'):
              text = p.read_text().replace('@mipmap/ic_launcher_background', '@color/ic_launcher_background')
              p.write_text(text)
          PY

      - name: Keep app upgrade-compatible
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, time
          p = Path('android/app/build.gradle')
          s = p.read_text()
          code = int(time.time())
          s, n = re.subn(r'versionCode\s+\d+', f'versionCode {code}', s, count=1)
          if not n:
              raise SystemExit('Could not find versionCode in android/app/build.gradle')
          marker = 'android {'
          if marker not in s:
              raise SystemExit('Could not find android block in android/app/build.gradle')
          signing = '''
              signingConfigs {
                  debug {
                      storeFile file('../../debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                      storeType 'pkcs12'
                  }
              }
          '''
          if 'signingConfigs {' not in s:
              s = s.replace(marker, marker + signing, 1)
          if re.search(r'buildTypes\\s*\\{', s) and not re.search(r'debug\\s*\\{[^}]*signingConfig\\s+signingConfigs\\.debug', s, re.S):
              s = re.sub(r'(buildTypes\\s*\\{\\s*debug\\s*\\{)', r'\\1\\n            signingConfig signingConfigs.debug', s, count=1)
          if not re.search(r'debug\\s*\\{[^}]*signingConfig\\s+signingConfigs\\.debug', s, re.S):
              raise SystemExit('Could not configure debug signing')
          p.write_text(s)
          print(f'Android versionCode set to {code}')
          PY

      - name: Sync
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug


      - name: Verify APK signing certificate
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr '[:lower:]' '[:upper:]')"
          EXPECTED="0A:9A:87:DE:77:9F:63:41:2A:C7:A0:B0:9D:DF:15:8B:E9:23:70:C2:5B:CC:2A:DA:DF:40:BC:94:1F:97:77:D1"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "APK signing certificate fingerprint mismatch."
            echo "Expected: $EXPECTED"
            echo "Actual:   ${ACTUAL:-unavailable}"
            exit 1
          fi
          echo "APK signing certificate fingerprint verified."

      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk hassalaty.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hassalaty-apk
          path: hassalaty.apk

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ github.run_number }}
          name: حصّالتي v${{ github.run_number }}
          files: hassalaty.apk
