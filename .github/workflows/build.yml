name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare app files
        run: |
          mkdir -p www assets
          cp index.html www/index.html
          sudo apt-get update -qq && sudo apt-get install -y imagemagick >/dev/null
          convert icon.svg -background none -resize 1024x1024 icon.png
          cp icon.png assets/icon-only.png
          cp icon.png assets/icon-foreground.png
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app@6 @fontsource/cairo
          npm install -D @capacitor/assets@3

      - name: Bundle Arabic font
        run: |
          mkdir -p www/fonts
          for weight in 400 700; do
            f=$(find node_modules/@fontsource/cairo/files -type f -name "cairo-arabic-$weight-normal.woff2" -print -quit)
            if [ -z "$f" ]; then echo "Cairo Arabic font weight $weight not found" >&2; exit 1; fi
            cp "$f" "www/fonts/cairo-arabic-$weight-normal.woff2"
          done
      - name: Create Android project
        run: |
          echo '{"appId":"com.hassalaty.app","appName":"حصّالتي","webDir":"www"}' > capacitor.config.json
          npx cap add android
      - name: Match Android gesture navigation to app theme
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in [Path('android/app/src/main/res/values/styles.xml'), Path('android/app/src/main/res/values-night/styles.xml')]:
              if not p.exists():
                  continue
              s=p.read_text()
              dark = 'values-night' in str(p)
              bar_color = '#0A0F1A' if dark else '#F2F5FA'
              light_bar = 'false' if dark else 'true'
              items=[
                  ('android:navigationBarColor', bar_color),
                  ('android:navigationBarDividerColor', bar_color),
                  ('android:windowLightNavigationBar', light_bar),
                  ('android:navigationBarContrastEnforced', 'false'),
              ]
              for key, value in items:
                  line=f'<item name="{key}">{value}</item>'
                  pattern=r'<item name="' + re.escape(key) + r'">.*?</item>'
                  if re.search(pattern, s):
                      s=re.sub(pattern, line, s, count=1)
                  else:
                      s=s.replace('</style>', '    '+line+'\\n  </style>', 1)
              p.write_text(s)
          PY

      - name: Generate icons
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#DCE6FF' --iconBackgroundColorDark '#DCE6FF'

      - name: Fix adaptive icon background resource
        run: |
          python3 - <<'PY'
          from pathlib import Path
          res = Path('android/app/src/main/res')
          values = res / 'values'
          values.mkdir(parents=True, exist_ok=True)
          colors = values / 'colors.xml'
          generated_color = values / 'ic_launcher_background.xml'
          color = '<color name="ic_launcher_background">#DCE6FF</color>'
          # Capacitor may already generate this color in its own XML file.
          # Never define the same Android resource twice.
          if not generated_color.exists():
              if colors.exists():
                  text = colors.read_text()
                  if 'name="ic_launcher_background"' not in text:
                      text = text.replace('</resources>', f'  {color}\\n</resources>')
                      colors.write_text(text)
              else:
                  colors.write_text(f'<resources>\\n  {color}\\n</resources>\\n')
          for p in (res / 'mipmap-anydpi-v26').glob('ic_launcher*.xml'):
              text = p.read_text().replace('@mipmap/ic_launcher_background', '@color/ic_launcher_background')
              p.write_text(text)
          PY

      - name: Keep app upgrade-compatible
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path('android/app/build.gradle')
          s = p.read_text()
          code = int(os.environ.get('GITHUB_RUN_NUMBER', '1')) + 1
          s, n = re.subn(r'versionCode\s+\d+', f'versionCode {code}', s, count=1)
          if not n:
              raise SystemExit('Could not find versionCode in android/app/build.gradle')
          p.write_text(s)
          print(f'Android versionCode set to {code}')
          PY
      - name: Sync
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk hassalaty.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hassalaty-apk
          path: hassalaty.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: حصّالتي v${{ github.run_number }}
          files: hassalaty.apk
