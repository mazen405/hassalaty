name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare app files
        run: |
          mkdir -p www assets
          cp index.html www/index.html
          sudo apt-get update -qq && sudo apt-get install -y imagemagick >/dev/null
          convert icon.svg -background none -resize 1024x1024 icon.png
          cp icon.png assets/icon-only.png
          cp icon.png assets/icon-foreground.png
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npm install -D @capacitor/assets@3

      - name: Create Android project
        run: |
          echo '{"appId":"com.hassalaty.app","appName":"حصّالتي","webDir":"www"}' > capacitor.config.json
          npx cap add android

      - name: Generate icons
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#DCE6FF' --iconBackgroundColorDark '#DCE6FF'

      - name: Sync
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk hassalaty.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hassalaty-apk
          path: hassalaty.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: حصّالتي v${{ github.run_number }}
          files: hassalaty.apk
