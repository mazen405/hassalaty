name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare app files
        run: |
          mkdir -p www assets
          cp index.html www/index.html
          cp icon.png assets/icon-only.png
          cp icon.png assets/icon-foreground.png
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npm install -D @capacitor/assets@3

      - name: Create Android project
        run: |
          echo '{"appId":"com.hassalaty.app","appName":"حصّالتي","webDir":"www"}' > capacitor.config.json
          npx cap add android

      - name: Make icons
        run: |
          sudo apt-get install -y imagemagick >/dev/null
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for p in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=android/app/src/main/res/mipmap-${p%%:*}
            sz=${p##*:}
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              convert icon.png -resize ${sz}x${sz} $d/$n.png
            done
          done
      - name: Sync
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk hassalaty.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hassalaty-apk
          path: hassalaty.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: حصّالتي ${{ github.run_number }}
          files: hassalaty.apk
